{% extends "employees/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-user me-2"></i>{{ employee.first_name }} {{ employee.last_name }}</h4>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-4">Employee ID</dt>
                    <dd class="col-sm-8">{{ employee.id }}</dd>

                    <dt class="col-sm-4">Email</dt>
                    <dd class="col-sm-8">{{ employee.email }}</dd>

                    <dt class="col-sm-4">Department</dt>
                    <dd class="col-sm-8"><span class="badge bg-info">{{ employee.department }}</span></dd>

                    <dt class="col-sm-4">Position</dt>
                    <dd class="col-sm-8">{{ employee.position }}</dd>

                    <dt class="col-sm-4">Hire Date</dt>
                    <dd class="col-sm-8">{{ employee.hire_date }}</dd>
                </dl>
            </div>
            <div class="card-footer">
                <a href="{% url 'employees:employee_list' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to List
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
